name: Sync app data

# Refreshes stars, releases, APK links, icons and screenshots for every
# listed app, then commits data/live.json — which the host rebuilds from.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch deploy.yml when hosting on GitHub Pages

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch live data from GitHub and F-Droid
        run: node scripts/sync.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snapshot if changed
        run: |
          git config user.name "osps-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "chore: refresh live app data"
          git push

      - name: Kick off the deploy
        # A push made with GITHUB_TOKEN does not trigger push-triggered workflows,
        # so GitHub Pages hosting needs an explicit nudge. Vercel/Cloudflare build
        # from the push webhook and need nothing here — leave PAGES_DEPLOY unset.
        if: vars.PAGES_DEPLOY == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
