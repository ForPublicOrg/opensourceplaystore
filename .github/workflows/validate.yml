name: Validate app listings

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Which manifests does this PR touch?
        id: changed
        run: |
          set -euo pipefail
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^data/apps/[a-z0-9-]+\.json$' | tr '\n' ' ' || true)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Validate manifests (schema always, live repo checks for what changed)
        run: |
          set -euo pipefail
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            node scripts/validate.js --check-remote --only ${{ steps.changed.outputs.files }}
          else
            node scripts/validate.js
          fi

      - name: Build site
        run: node build.js
